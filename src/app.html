<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><meta name="theme-color" content="#eae9e4" media="(prefers-color-scheme: light)"/><meta name="theme-color" content="#171816" media="(prefers-color-scheme: dark)"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><meta name="apple-mobile-web-app-title" content="Folio"/><script>try{const t=localStorage.getItem('folio-appearance');if(t==='light'||t==='dark'){document.documentElement.dataset.theme=t;for(const m of document.querySelectorAll('meta[name="theme-color"]'))m.content=t==='dark'?'#171816':'#eae9e4';}}catch{}</script><link rel="manifest" href="/manifest.webmanifest"/><link rel="icon" href="/favicon.svg"/><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"/>%sveltekit.head%</head><body data-sveltekit-preload-data="hover"><div style="display:contents">%sveltekit.body%</div></body></html>
